<!-- TMI Quiz Modal -->
<div id="tmi-overlay" class="modal-overlay" onclick="if(event.target===this)closeQuiz()">
    <div class="modal-content">
        <button class="close-btn" onclick="closeQuiz()">&times;</button>
        <h3>TMI Quiz</h3>
        <p class="muted" style="margin-bottom: 1rem;">모두 맞추시면 보상을 드립니다.</p>
        <div id="quiz-questions"></div>
    </div>
</div>

<script>
    const DB_URL = 'https://website-a92c1-default-rtdb.firebaseio.com';

    // Firebase Comments System
    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function commentHtml(c) {
        const date = new Date(c.timestamp).toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' });
        return `<div class="comment-box">
            <div style="font-family:monospace; font-size:0.85rem;">
                <strong>${escapeHtml(c.name)}</strong> <span class="muted">(${date})</span>
                ${c.pinned ? '<span>[Pinned]</span>' : ''}
                <button onclick="pinComment('${c._key}', ${!!c.pinned})" style="border:none; background:none; padding:0; text-decoration:underline;">[pin]</button>
                <button onclick="deleteComment('${c._key}')" style="border:none; background:none; padding:0; text-decoration:underline;">[del]</button>
            </div>
            <p style="margin-top:0.3rem; margin-bottom:0;">${escapeHtml(c.text)}</p>
        </div>`;
    }

    function renderComments(data) {
        const list = document.getElementById('comments-list');
        if (!data) {
            list.innerHTML = '<p class="muted">아직 작성된 댓글이 없습니다.</p>';
            return;
        }
        const comments = Object.entries(data).map(([key, val]) => ({ _key: key, ...val }));
        const pinned = comments.filter(c => c.pinned).sort((a, b) => b.timestamp - a.timestamp);
        const normal = comments.filter(c => !c.pinned).sort((a, b) => b.timestamp - a.timestamp);
        
        list.innerHTML = pinned.map(commentHtml).join('') + normal.map(commentHtml).join('');
    }

    function loadComments() {
        fetch(`${DB_URL}/comments.json`)
            .then(r => r.json())
            .then(data => renderComments(data))
            .catch(() => renderComments(null));
    }

    function submitComment() {
        const name = document.getElementById('comment-name').value.trim();
        const text = document.getElementById('comment-text').value.trim();
        if (!name || !text) { alert('닉네임과 내용을 모두 입력해주세요.'); return; }
        
        fetch(`${DB_URL}/comments.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, text, timestamp: Date.now() })
        })
        .then(() => {
            document.getElementById('comment-text').value = '';
            loadComments();
        })
        .catch(err => alert('오류 발생: ' + err.message));
    }

    function pinComment(key, isPinned) {
        const pw = prompt('관리자 비밀번호:');
        if (pw === 'password') {
            fetch(`${DB_URL}/comments/${key}.json`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pinned: !isPinned })
            }).then(() => loadComments());
        } else if (pw !== null) { alert('비밀번호 불일치'); }
    }

    function deleteComment(key) {
        const pw = prompt('관리자 비밀번호:');
        if (pw === 'password') {
            fetch(`${DB_URL}/comments/${key}.json`, { method: 'DELETE' }).then(() => loadComments());
        } else if (pw !== null) { alert('비밀번호 불일치'); }
    }

    loadComments();

    // Photo toggle
    let photoOpen = false;
    document.getElementById('hero-name').addEventListener('click', () => {
        photoOpen = !photoOpen;
        document.getElementById('logo-photo-card').style.display = photoOpen ? 'block' : 'none';
    });

    // BGM Audio Toggle
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    let musicOn = false;

    function toggleMusic() {
        musicOn = !musicOn;
        if (musicOn) {
            bgm.muted = false;
            bgm.play().catch(() => {});
            musicBtn.textContent = '[bgm: on]';
        } else {
            bgm.muted = true;
            musicBtn.textContent = '[bgm: off]';
        }
    }

    // Visit tracker
    function trackVisit() {
        const kst = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
        fetch(`${DB_URL}/visits/${kst}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ '.sv': { 'increment': 1 } })
        })
        .then(r => r.json())
        .then(count => { document.getElementById('visit-count').textContent = count; })
        .catch(() => { document.getElementById('visit-count').textContent = '?'; });
    }
    trackVisit();

    // Easter egg: TMI Quiz
    let aboutClickCount = 0;
    function aboutMeClick() {
        aboutClickCount++;
        if (aboutClickCount >= 5) {
            aboutClickCount = 0;
            openQuiz();
        }
    }

    const quizData = [
        { q: 'Q1. 다녀온 여행지는?', opts: ['대만', '필리핀', '중국-상하이'], answer: 0 },
        { q: 'Q2. 시험 전날 가장 많이 하는 생각은?', opts: ['망했다', '어떡하지?', '아직 하루나 남았네~'], answer: 1 },
        { q: 'Q3. 생일은?', opts: ['0223', '0202', '0220'], answer: 2 }
    ];
    let quizAnswers = [null, null, null];

    function openQuiz() {
        quizAnswers = [null, null, null];
        const qc = document.getElementById('quiz-questions');
        qc.innerHTML = quizData.map((q, qi) =>
            `<div style="margin-bottom:1rem;">
                <p><strong>${q.q}</strong></p>
                ${q.opts.map((opt, oi) =>
                    `<label style="display:block; margin:0.2rem 0; font-family:monospace;">
                        <input type="radio" name="q${qi}" onclick="quizAnswers[${qi}]=${oi}"> ${opt}
                    </label>`
                ).join('')}
            </div>`
        ).join('') + `<button onclick="showFinalResult()" style="width:100%; margin-top:0.5rem;">[제출하기]</button>`;
        document.getElementById('tmi-overlay').style.display = 'flex';
    }

    function closeQuiz() { document.getElementById('tmi-overlay').style.display = 'none'; }

    function showFinalResult() {
        closeQuiz();
        const allCorrect = quizAnswers.every((a, i) => a === quizData[i].answer);
        if (allCorrect) {
            alert('🎉 정답입니다! 연락처로 123을 보내주세요!');
        } else {
            alert('😭 오답이 있습니다. 다시 시도해보세요!');
        }
    }

    // Easter egg: Contact hearts
    let connectClickCount = 0;
    function connectClick() {
        connectClickCount++;
        if (connectClickCount >= 5) {
            connectClickCount = 0;
            alert('❤️ (Easter egg triggered!)');
        }
    }
</script>

