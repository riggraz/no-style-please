    <!-- Minimalist Typography & System Font-stack -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-muted: #666666;
            --border-color: #dddddd;
            --link-color: #000000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --text-muted: #888888;
                --border-color: #333333;
                --link-color: #ffffff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            max-width: 750px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Typography */
        h1, h2, h3, h4 {
            font-weight: 600;
            line-height: 1.3;
            margin-top: 2rem;
            margin-bottom: 0.8rem;
            color: var(--text-color);
        }

        h1 { font-size: 1.8rem; margin-top: 0; }
        h2 { font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3rem; }
        h3 { font-size: 1.05rem; }

        p { margin-bottom: 1rem; color: var(--text-color); }
        small, .muted { color: var(--text-muted); font-size: 0.88rem; }

        a {
            color: var(--link-color);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        a:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
            text-decoration: none;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed var(--border-color);
            font-family: monospace;
        }

        nav a {
            text-decoration: none;
            margin-right: 0.8rem;
        }

        nav a:hover {
            text-decoration: underline;
            background-color: transparent;
            color: var(--link-color);
        }

        /* Lists & Items */
        ul {
            list-style-type: none;
            padding-left: 0;
            margin-bottom: 1.5rem;
        }

        li {
            margin-bottom: 0.8rem;
        }

        .list-item-title {
            font-weight: 600;
        }

        /* Section Spacing */
        section {
            margin-bottom: 3rem;
        }

        /* Project / Card minimal list */
        .project-item {
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px dotted var(--border-color);
        }

        /* Comments Form & List */
        input[type="text"], textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.8rem;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-family: inherit;
            border-radius: 0;
        }

        button {
            padding: 0.4rem 0.9rem;
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            font-family: monospace;
            cursor: pointer;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .comment-box {
            border-left: 2px solid var(--border-color);
            padding-left: 0.8rem;
            margin-bottom: 1rem;
        }

        /* Minimal Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-color);
            border: 1px solid var(--text-color);
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.8rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
